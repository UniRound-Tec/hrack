# D0 security prototype: pin DSH's dual-face directory picker to the official
# remote-browser implementation. Production generates the same overlay in
# HRack-owned userData; it must never mutate the user's DSH profile.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse-host
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
